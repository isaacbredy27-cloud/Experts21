# Netlify builds the expert-team web app in web/ with no extra settings.
# The build reads .claude/agents, .claude/skills, knowledge/ and docs/ from this repo,
# so every push to main redeploys the app with the latest agents and documents.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Single-page app: unknown paths load the app (API routes are matched first by the functions' config.path).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
